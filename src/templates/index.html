<!doctype html>
<html lang="{$LANG.lang|escape:'html'}" class="h-100">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        {$LANG.title|escape:'html'}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >
</head>

<body class="d-flex flex-column h-100">

    <header>
        <nav class="navbar navbar-expand-md navbar-dark bg-dark mb-4">
            <div class="container">
                <a class="navbar-brand" href="/">
                    {$LANG.title|escape:'html'}
                </a>
            </div>
        </nav>
    </header>

    <main class="flex-shrink-0">
        <div class="container">

            {if $error}
                <div
                    class="alert alert-danger"
                    role="alert"
                >
                    {$error|escape:'html'}
                </div>
            {/if}

            {if $template}
                {include file=$template}
            {/if}

        </div>
    </main>

    <footer class="footer mt-auto py-3 bg-light">
        <div class="container d-flex justify-content-end">

            <form
                method="get"
                action="/"
                class="d-inline-block"
            >
                {*
                    Dil değiştirildiğinde seçili oyunun
                    query string'den kaybolmasını önlüyoruz.
                *}
                {if isset($selectedGame) && $selectedGame != ''}
                    <input
                        type="hidden"
                        name="game"
                        value="{$selectedGame|escape:'html'}"
                    >
                {/if}

                <select
                    name="lang"
                    id="lang"
                    class="form-select form-select-sm"
                    onchange="this.form.submit()"
                >
                    {foreach $langs as $key => $value}
                        <option
                            value="{$key|escape:'html'}"
                            {if $key == $LANG.lang}
                                selected
                            {/if}
                        >
                            {$value|escape:'html'}
                        </option>
                    {/foreach}
                </select>
            </form>

        </div>
    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"
    ></script>

</body>

</html>
