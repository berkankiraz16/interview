<div class="row mb-3">
    <div class="col-auto">
        <form method="get" action="/">
            <label for="games" class="form-label">
                {$LANG.select_game}
            </label>
        

            <!-- seçilen oyun id bilgisini backend e submit leyen kısım -->
            <select
                class="form-select"
                id="games"
                name="game"
                onchange="this.form.submit()"
            >
                <option value="">
                    {$LANG.select_game}
                </option>

                {foreach $games as $game}
                    <option value="{$game.id}">
                        {$game.name}
                    </option>
                {/foreach}
            </select>
        </form>
    </div>
</div>

<!-- oyun seçilmediğinde ürün listesini göstermemek içn tabloyu ürün sayısının
  büyük olduğu durumlarda göstermek üzere şarta bağğlıyoruz -->
{if $products|@count > 0}
<div class="table">
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>{$LANG.prd_name}</th>
                <th>{$LANG.stock}</th>
                <th>{$LANG.price}</th>
                <th>{$LANG.quantity}</th>
            </tr>
        </thead>
        <tbody>
            {foreach $products as $product}
                <tr>
                    <td>{$product.name}</td>
                    <td>{$product.stock}</td>
                    <td>{$product.price}</td>
                    <td>
                        <input name="quantity" type="number" class="form-control" value="1" min="{$product.min_order}"
                            max="{$product.max_order}" id="quantity_{$product.id}">
                    </td>
                </tr>
            {/foreach}
        </tbody>
    </table>
    <button type="button" class="btn btn-primary" onclick="addProducts()">{$LANG.buy}</button>
</div>
{/if}
