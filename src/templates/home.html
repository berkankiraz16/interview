<div class="row mb-3">
    <div class="col-auto">
        <form method="get" action="/">
            <label for="games" class="form-label">
                {$LANG.select_game}
            </label>

            <!-- seçilen oyun id bilgisini backend' e submit' leyen kısım -->
            <select
                class="form-select"
                id="games"
                name="game"
                onchange="this.form.submit()"
            >
                <option
                    value=""
                    {if $selectedGame == ''}selected{/if}
                >
                    {$LANG.select_game}
                </option>

                {foreach $games as $game}
                    <option
                        value="{$game.id|escape:'html'}"
                        {if $selectedGame == $game.id}selected{/if}
                    >
                        <!-- Dış API'den gelen veriyi güvenli şekilde render
                        etmek ve olası XSS açıklarını önlemek için HTML escape uygulanır -->
                        {$game.name|escape:'html'}
                    </option>
                {/foreach}
            </select>
        </form>
    </div>
</div>

<!-- oyun seçilmediğinde ürün listesini göstermemek içn tabloyu ürün sayısının
  büyük olduğu durumlarda göstermek üzere şarta bağğlıyoruz -->
{if $products|@count > 0}
  <div class="table-responsive">
      <table class="table table-striped table-hover">
          <thead>
              <tr>
                  <th>{$LANG.prd_name}</th>
                  <th>{$LANG.stock}</th>
                  <th>{$LANG.price}</th>
                  <th>{$LANG.quantity}</th>
              </tr>
          </thead>

          <tbody>
              {foreach $products as $product}
                  <tr>
                      <td>
                          {$product.name|escape:'html'}
                      </td>

                      <td>
                          {$product.stock}
                      </td>

                      <td>
                          {$product.price|escape:'html'}
                      </td>

                      <td>
                          <input
                              name="quantity"
                              type="number"
                              class="form-control"
                              value="{$product.min_order}"
                              min="{$product.min_order}"
                              {if $product.max_order}
                                  max="{$product.max_order}"
                              {/if}
                              id="quantity_{$product.id|escape:'html'}"
                          >
                      </td>
                  </tr>
              {/foreach}
          </tbody>
      </table>
  </div>
{/if}
